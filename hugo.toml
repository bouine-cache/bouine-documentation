[build.buildStats]
  enable = true

[params]
  title = 'bouine'
  description = 'Bouine is a cloud-native HTTP cache in Go - RFC9111 compliant, zero-alloc hit path, gossip clustering, no external K/V store.'
  images = ['logo.png']
  mainSections = ['docs', 'compare']

  [params.doks]
    colorMode = 'auto'
    colorModeToggler = true
    navbarSticky = true
    containerBreakpoint = 'fluid'
    navBarButton = true
    navBarButtonUrl = '/docs/getting-started/install/'

    flexSearch = true
    searchExclKinds = []
    searchExclTypes = []
    showSearch = []
    indexSummary = false
    showSummary = true
    searchLimit = 20
    sectionSwitcher = false
    sectionNav = ['docs']
    toTopButton = true
    breadcrumbTrail = true
    headlineHash = true
    scrollSpy = true
    headerBar = true
    backgroundDots = true
    aiButtons = false
    docsVersioning = true
    docsVersion = "0.4"
    docsLatestVersion = "0.4"
    multilingualMode = true
    showMissingLanguages = true
    editPage = true
    lastMod = true
    repoHost = 'GitHub'
    docsRepo = 'https://github.com/bouine-cache/bouine-documentation'
    docsRepoBranch = 'main'
    docsRepoSubPath = ''

  [params.googleAnalytics]
    id = 'G-1T6QRCCPMQ'

  [params.seo]
    [params.seo.title]
      separator = '|'
      suffix = 'bouine'
    [params.seo.description]
      summaryFallback = 'Documentation for bouine, a Kubernetes-native cache.'
    [params.seo.schemas]
      type = 'Organization'
      name = 'bouine'
      logo = 'logo.png'
      sameAs = ['https://github.com/bouine-cache/bouine', 'https://hub.docker.com/r/bouinecache/bouine']
      images = ['logo.png']

[markup]
  [markup.highlight]
    style = 'dracula'
    lineNos = false
    guessSyntax = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[outputs]
  home = ['HTML', 'RSS', 'sitemap', 'searchIndex', 'llms', 'markdown']
  page = ['HTML', 'markdown']
  section = ['HTML', 'RSS', 'sitemap']

[outputFormats.searchIndex]
  mediaType = 'application/json'
  baseName = 'search-index'
  isPlainText = true
  notAlternative = true

[outputFormats.markdown]
  baseName = 'index'
  isHTML = false
  isPlainText = true
  mediaType = 'text/markdown'

[outputFormats.llms]
  baseName = 'llms'
  isHTML = false
  isPlainText = true
  mediaType = 'text/plain'

[outputFormats.sitemap]
  mediaType = 'application/xml'
  baseName = 'sitemap'
  isHTML = false
  isPlainText = true
  noUgly = true
  rel  = 'sitemap'

