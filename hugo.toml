baseURL = 'https://bouine.org/'
title = 'bouine'
theme = 'doks'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableGitInfo = true
enableEmoji = true
enableRobotsTXT = true
locale = 'en-US'
disableLanguages = ['de', 'nl']
summarylength = 30

[languages]
  [languages.en]
    languageName = "English"
    contentDir = "content/en"
    weight = 10
    [languages.en.params]
      languageISO = "EN"
      languageTag = "en-US"

  [languages.fr]
    languageName = "Français"
    contentDir = "content/fr"
    weight = 20
    [languages.fr.params]
      languageISO = "FR"
      languageTag = "fr-FR"

[build.buildStats]
  enable = true

[params]
  title = 'bouine'
  description = 'Bouine is a cloud-native HTTP cache in Go - RFC9111 compliant, zero-alloc hit path, gossip clustering, no external K/V store.'
  images = ['logo.png']
  mainSections = ['docs', 'compare']

  [params.doks]
    colorMode = 'auto'
    colorModeToggler = true
    navbarSticky = true
    containerBreakpoint = 'fluid'
    navBarButton = true
    navBarButtonUrl = '/docs/getting-started/install/'

    flexSearch = true
    searchExclKinds = []
    searchExclTypes = []
    showSearch = []
    indexSummary = false
    showSummary = true
    searchLimit = 20
    sectionSwitcher = false
    sectionNav = ['docs']
    toTopButton = true
    breadcrumbTrail = true
    headlineHash = true
    scrollSpy = true
    headerBar = true
    backgroundDots = true
    aiButtons = false
    multilingualMode = true
    showMissingLanguages = true
    editPage = true
    lastMod = true
    repoHost = 'GitHub'
    docsRepo = 'https://github.com/bouine-cache/bouine-documentation'
    docsRepoBranch = 'main'
    docsRepoSubPath = ''

  [params.seo]
    [params.seo.title]
      separator = '|'
      suffix = 'bouine'
    [params.seo.description]
      summaryFallback = 'Documentation for bouine, a Kubernetes-native cache.'
    [params.seo.schemas]
      type = 'Organization'
      name = 'bouine'
      logo = 'logo.png'
      sameAs = ['https://github.com/bouine-cache/bouine', 'https://hub.docker.com/r/bouinecache/bouine']
      images = ['logo.png']

[markup]
  [markup.highlight]
    style = 'dracula'
    lineNos = false
    guessSyntax = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[outputs]
  home = ['HTML', 'RSS', 'sitemap', 'searchIndex', 'llms']
  page = ['HTML', 'markdown']
  section = ['HTML', 'RSS', 'sitemap']

[outputFormats.searchIndex]
  mediaType = 'application/json'
  baseName = 'search-index'
  isPlainText = true
  notAlternative = true

[outputFormats.markdown]
  baseName = 'index'
  isHTML = false
  isPlainText = true
  mediaType = 'text/markdown'

[outputFormats.llms]
  baseName = 'llms'
  isHTML = false
  isPlainText = true
  mediaType = 'text/plain'

[outputFormats.sitemap]
  mediaType = 'application/xml'
  baseName = 'sitemap'
  isHTML = false
  isPlainText = true
  noUgly = true
  rel  = 'sitemap'

