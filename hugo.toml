baseURL = 'https://bouine.org/'
title = 'bouine'
theme = 'doks'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableGitInfo = true
enableEmoji = true
enableRobotsTXT = true
locale = 'en-US'
disableLanguages = ['de', 'nl']
summarylength = 30

[languages]
  [languages.en]
    languageName = "English"
    contentDir = "content/en"
    weight = 10
    [languages.en.params]
      languageISO = "EN"
      languageTag = "en-US"

  [languages.fr]
    languageName = "Français"
    contentDir = "content/fr"
    weight = 20
    [languages.fr.params]
      languageISO = "FR"
      languageTag = "fr-FR"
    [[languages.fr.menus.main]]
      name = 'Docs'
      url = '/docs/getting-started/install/'
      weight = 10
    [[languages.fr.menus.main]]
      name = 'Configuration'
      url = '/docs/configuration/'
      weight = 20
    [[languages.fr.menus.main]]
