# Compare criterion help tooltips
[criterionK8sDeploy]
  other = "First-class StatefulSet support with headless Service DNS bootstrapping, pod discovery, and Helm-managed rolling updates."

[criterionHelmChart]
  other = "Official, maintained Helm chart with a full values.yaml reference and production defaults."

[criterionYamlConfig]
  other = "Declarative YAML configuration instead of a custom DSL (nginx.conf, HAProxy cfg, VCL, Caddyfile)."

[criterionHotReload]
  other = "Reload configuration without dropping active connections or restarting the process."

[criterionSingleBinary]
  other = "No dynamic modules, no shared library dependencies — one binary deploys everywhere."

[criterionPrometheus]
  other = "Native /metrics endpoint exposing cache hit/miss ratios, latency histograms, and cluster health without external exporters."

[criterionOtel]
  other = "Native OTel spans for the full cache hit/miss/peer-fetch lifecycle, traceable through any OTel-compatible backend."

[criterionDistributedClustering]
  other = "Built-in gossip-based clustering with multiple consistency modes (strong, eventual, full) — no external control plane required."

[criterionSubSecondInvalidation]
  other = "Purge and ban operations reach all cluster peers in under one second via HTTP fan-out, not just gossip convergence."

[criterionStaleIfError]
  other = "Serve cached stale content when the origin returns 5xx errors or times out, preventing user-facing failures."

[criterionStayinAlive]
  other = "Serve stale content indefinitely when the upstream is completely down — the cache becomes the origin during outages."

[criterionDashboard]
  other = "Live operator dashboard showing metrics, route performance, cluster health, and one-click invalidation — no external tooling needed."

[criterionMtls]
  other = "Mutual TLS encryption between cluster nodes for secure gossip and peer-fetch traffic."

[criterionRfc9111]
  other = "Implements the HTTP caching specification (RFC 9111) directly. bouine scores 94% on the cache-tests.fyi conformance suite."

[criterionVary]
  other = "Respects the Vary response header for cache key derivation, serving the correct variant per request headers."

[criterionSurrogateKeys]
  other = "Origin can tag responses with Surrogate-Key / Cache-Tag headers for grouped invalidation across multiple URLs at once."

[criterionRequestCoalescing]
  other = "Deduplicates concurrent requests for the same cache key — only one request reaches the origin, the rest wait for the cached response."

[criterionNegativeCaching]
  other = "Caches error responses (404, 405, 410, 501) with a configurable TTL per route to protect the origin from repeated error traffic."

[criterionProgrammable]
  other = "Ability to inject custom request/response processing logic via a scripting language (Lua, WASM, VCL, njs) or plugins."

[criterionImplLanguage]
  other = "The primary language the proxy/cache is written in. Affects contribution ease, build speed, and runtime memory model."

[criterionNoExternalKV]
  other = "Embedded hot tier in RAM with optional warm tier on disk. No Redis, no Memcached, no external control plane process to operate."

[criterionSieve]
  other = "SIEVE eviction algorithm: simple, near-LRU-K hit ratio, O(1) per operation. Alternatives typically use standard LRU."

[criterionConsistentHash]
  other = "256 virtual nodes per real node for consistent hashing. On a cache miss, the requesting node checks the owner node before going to origin. ~0.3ms added latency."

[criterionJitteredTtls]
  other = "Random ±N% applied to every TTL to prevent synchronized expiry stampedes across cached entries."

[criterionBackgroundSwr]
  other = "Serves stale content immediately while a background goroutine revalidates with the origin. Concurrency bounded to 256 goroutines."

[criterionHedgedFetch]
  other = "Fires a duplicate request after a configurable timeout; the first response wins, reducing tail latency on slow origins."

[criterionZeroAlloc]
  other = "Cache hit path allocates zero bytes on the hot path (40 ns/op, 0 allocs). Benchmark-gated in CI to block performance regressions."