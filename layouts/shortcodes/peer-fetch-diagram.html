<div style="position:relative;margin:1.5rem 0;">
  <button id="pf-replay" onclick="pfReplay()" style="position:absolute;top:8px;right:8px;z-index:10;cursor:pointer;padding:.2rem .7rem;border:1px solid rgba(139,92,246,.5);border-radius:4px;background:rgba(13,13,26,.85);color:#c4b5fd;font-size:.7rem;font-family:monospace;letter-spacing:.05em;">↺ replay</button>
  <svg id="pf-svg" viewBox="0 0 600 360" style="width:100%;border-radius:8px;background:#0d0d1a;display:block;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="pf-glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="pf-glow-sm"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>

    <!-- Client -->
    <rect x="8" y="158" width="68" height="44" rx="6" fill="rgba(71,85,105,.25)" stroke="#475569" stroke-width="1.5"/>
    <text x="42" y="177" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">CLIENT</text>
    <text x="42" y="192" text-anchor="middle" fill="#64748b" font-size="8">GET /api/v1</text>

    <!-- bouine-1 (receiving node, MISS) -->
    <rect id="pf-n1" x="120" y="110" width="130" height="140" rx="10" fill="rgba(109,40,217,.1)" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="185" y="132" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="700">bouine-1</text>
    <text x="185" y="147" text-anchor="middle" fill="#4c1d95" font-size="8">receiving node</text>
    <rect x="133" y="155" width="104" height="22" rx="3" fill="rgba(109,40,217,.15)" stroke="#5b21b6" stroke-width="1"/>
    <text x="185" y="170" text-anchor="middle" fill="#a78bfa" font-size="8">L4 Cache: MISS</text>
    <rect x="133" y="181" width="104" height="22" rx="3" fill="rgba(109,40,217,.12)" stroke="#4c1d95" stroke-width="1"/>
    <text x="185" y="196" text-anchor="middle" fill="#7c3aed" font-size="8">L6 Cluster lookup</text>
    <rect x="133" y="207" width="104" height="22" rx="3" fill="rgba(109,40,217,.08)" stroke="#3b0764" stroke-width="1"/>
    <text x="185" y="222" text-anchor="middle" fill="#6d28d9" font-size="8">consistent-hash →</text>

    <!-- bouine-0 (owner, HIT) -->
    <rect id="pf-n0" x="340" y="60" width="130" height="130" rx="10" fill="rgba(109,40,217,.08)" stroke="#3b0764" stroke-width="1.5"/>
    <text x="405" y="82" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="700">bouine-0</text>
    <text x="405" y="97" text-anchor="middle" fill="#4c1d95" font-size="8">owner node</text>
    <rect x="353" y="105" width="104" height="22" rx="3" fill="rgba(34,197,94,.12)" stroke="#16a34a" stroke-width="1"/>
    <text x="405" y="120" text-anchor="middle" fill="#4ade80" font-size="8">L3 hot store: HIT ✓</text>
    <rect x="353" y="131" width="104" height="22" rx="3" fill="rgba(109,40,217,.1)" stroke="#4c1d95" stroke-width="1"/>
    <text x="405" y="146" text-anchor="middle" fill="#6d28d9" font-size="8">5 ns · 0 allocs</text>
    <rect x="353" y="157" width="104" height="22" rx="3" fill="rgba(109,40,217,.08)" stroke="#3b0764" stroke-width="1"/>
    <text x="405" y="172" text-anchor="middle" fill="#4c1d95" font-size="7.5">HTTP/1.1 mTLS :8443</text>

    <!-- bouine-2 (gossip peer) -->
    <rect id="pf-n2" x="340" y="240" width="130" height="80" rx="10" fill="rgba(109,40,217,.06)" stroke="#3b0764" stroke-width="1"/>
    <text x="405" y="265" text-anchor="middle" fill="#6d28d9" font-size="11" font-weight="700">bouine-2</text>
    <text x="405" y="282" text-anchor="middle" fill="#3b0764" font-size="8">replica node</text>
    <rect x="353" y="290" width="104" height="18" rx="3" fill="rgba(109,40,217,.06)" stroke="#2d1b69" stroke-width="1"/>
    <text x="405" y="303" text-anchor="middle" fill="#3b0764" font-size="7.5">gossip member</text>

    <!-- Origin (not reached) -->
    <rect id="pf-origin" x="510" y="148" width="82" height="64" rx="8" fill="rgba(30,41,59,.35)" stroke="#1e293b" stroke-width="1"/>
    <text x="551" y="172" text-anchor="middle" fill="#475569" font-size="10">ORIGIN</text>
    <text x="551" y="188" text-anchor="middle" fill="#334155" font-size="8">not reached</text>
    <text x="551" y="200" text-anchor="middle" fill="#1e293b" font-size="7.5">(HIT in cluster)</text>

    <!-- Gossip lines (static dashes) -->
    <line x1="252" y1="180" x2="340" y2="125" stroke="#2d1b69" stroke-width="1" stroke-dasharray="5,4" opacity="0.5" id="pf-g01"/>
    <line x1="252" y1="210" x2="340" y2="280" stroke="#2d1b69" stroke-width="1" stroke-dasharray="5,4" opacity="0.5" id="pf-g12"/>
    <line x1="470" y1="130" x2="470" y2="240" stroke="#2d1b69" stroke-width="1" stroke-dasharray="5,4" opacity="0.5" id="pf-g02"/>

    <!-- Step labels -->
    <text id="pf-step" x="300" y="345" text-anchor="middle" fill="#a78bfa" font-size="10.5" opacity="0"></text>

    <!-- Animated dots -->
    <circle id="pf-d1" cx="76" cy="180" r="5" fill="#a78bfa" filter="url(#pf-glow)" opacity="0"/>
    <circle id="pf-d2" cx="252" cy="196" r="5" fill="#f59e0b" filter="url(#pf-glow)" opacity="0"/>
    <circle id="pf-d3" cx="470" cy="125" r="5" fill="#4ade80" filter="url(#pf-glow)" opacity="0"/>
    <circle id="pf-d4" cx="470" cy="125" r="5" fill="#4ade80" filter="url(#pf-glow)" opacity="0"/>
  </svg>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script>
(function(){
  function pfPlay(){
    var el=function(id){return document.getElementById(id);};
    ['pf-d1','pf-d2','pf-d3','pf-d4'].forEach(function(id){
      anime.set('#'+id,{opacity:0,translateX:0,translateY:0});
    });
    anime.set('#pf-step',{opacity:0});
    anime.set('#pf-n1',{stroke:'#4c1d95',fill:'rgba(109,40,217,.1)'});
    anime.set('#pf-n0',{stroke:'#3b0764',fill:'rgba(109,40,217,.08)'});

    var tl=anime.timeline({autoplay:true,loop:false});

    tl
      // Gossip lines fade in
      .add({targets:'#pf-g01,#pf-g12,#pf-g02',opacity:[0,.5],duration:600,easing:'easeOutQuad',delay:anime.stagger(120)})

      // Step 1: request arrives at bouine-1
      .add({targets:'#pf-step',innerHTML:'1. Request arrives at bouine-1',opacity:1,duration:300},'-=200')
      .add({targets:'#pf-d1',opacity:1,duration:150},'+=100')
      .add({targets:'#pf-d1',translateX:44,duration:400,easing:'easeOutQuad'})
      .add({targets:'#pf-n1',stroke:['#4c1d95','#ef4444'],duration:300},'-=100')

      // Step 2: MISS — peer fetch to bouine-0
      .add({targets:'#pf-step',innerHTML:'2. Cache MISS — consistent-hash owner is bouine-0',duration:300},'+=300')
      .add({targets:'#pf-d1',opacity:0,duration:200})
      .add({targets:'#pf-d2',opacity:1,cx:252,cy:196,duration:100},'+=100')
      .add({targets:'#pf-d2',translateX:88,translateY:-71,fill:'#f59e0b',duration:550,easing:'easeInOutQuad'})
      .add({targets:'#pf-n1',stroke:'#4c1d95',duration:200},'-=200')

      // Step 3: bouine-0 HIT
      .add({targets:'#pf-step',innerHTML:'3. bouine-0 hot store HIT → ~0.3ms peer fetch',duration:300},'+=100')
      .add({targets:'#pf-n0',stroke:['#3b0764','#22c55e'],fill:'rgba(34,197,94,.1)',duration:400},'-=100')

      // Step 4: response back to bouine-1 then client
      .add({targets:'#pf-step',innerHTML:'4. Response returns to bouine-1 → client',duration:300},'+=500')
      .add({targets:'#pf-d3',opacity:1,cx:470,cy:125,translateX:0,translateY:0,duration:100})
      .add({targets:'#pf-d3',translateX:-218,translateY:71,fill:'#4ade80',duration:500,easing:'easeInOutQuad'})
      .add({targets:'#pf-d4',opacity:1,cx:252,cy:196,duration:100},'-=100')
      .add({targets:'#pf-d4',translateX:-176,translateY:-16,fill:'#4ade80',duration:400,easing:'easeInQuad'},'+=100')

      // Final label
      .add({targets:'#pf-step',innerHTML:'X-Cache: HIT · Age: 0 · via peer bouine-0 · latency +0.3ms',fill:'#4ade80',duration:400},'+=200');
  }
  window.pfReplay=pfPlay;
  if(typeof anime!=='undefined'){pfPlay();}
})();
</script>
