<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script>
(function(){
  function archPlay(){
    var targets=['#ao-client','#ao-ct1','#ao-ct2','#ao-arr1','#ao-box','#ao-boxt','#ao-boxsub','#ao-arr2','#ao-origin','#ao-ot1','#ao-ot2'];
    anime.set('#arch-overview',{opacity:1});
    anime.set(targets,{opacity:0});
    anime.set('#arch-layers',{opacity:0});
    anime.set('#arch-layers .al',{opacity:0,translateX:-28});
    var tl=anime.timeline({autoplay:true,loop:false});
    tl.add({targets:targets,opacity:[0,1],duration:700,easing:'easeOutQuad',delay:anime.stagger(70)})
      .add({targets:'#ao-box',stroke:['#8b5cf6','#c4b5fd','#8b5cf6'],duration:700,easing:'easeInOutSine'},'+=400')
      .add({targets:'#arch-overview',opacity:0,duration:450,easing:'easeInQuad'},'+=350')
      .add({targets:'#arch-layers',opacity:1,duration:350,easing:'easeOutQuad'},'-=200')
      .add({targets:'#arch-layers .al',translateX:[-28,0],opacity:[0,1],duration:380,easing:'easeOutBack',delay:anime.stagger(55)},'-=150');
  }
  window.archReplay=archPlay;
  if(typeof anime!=='undefined'){archPlay();}
  else{document.currentScript.previousElementSibling.addEventListener('load',archPlay);}
})();
</script>
