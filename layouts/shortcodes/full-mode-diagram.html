<div style="position:relative;margin:1.5rem 0;">
  <button id="fm-replay" onclick="fmReplay()" style="position:absolute;top:8px;right:8px;z-index:10;cursor:pointer;padding:.2rem .7rem;border:1px solid rgba(139,92,246,.5);border-radius:4px;background:rgba(13,13,26,.85);color:#c4b5fd;font-size:.7rem;font-family:monospace;letter-spacing:.05em;">↺ replay</button>
  <svg id="fm-svg" viewBox="0 0 700 420" style="width:100%;border-radius:8px;background:#0d0d1a;display:block;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="fm-glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>

    <!-- Title -->
    <text id="fm-title" x="350" y="28" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700" opacity="0">Full mode — every node holds every key</text>

    <!-- Client -->
    <rect id="fm-client" x="16" y="145" width="64" height="42" rx="6" fill="rgba(71,85,105,.25)" stroke="#475569" stroke-width="1.5" opacity="0"/>
    <text id="fm-ct" x="48" y="164" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600" opacity="0">CLIENT</text>
    <text id="fm-cu" x="48" y="176" text-anchor="middle" fill="#64748b" font-size="7" opacity="0">GET /new</text>

    <!-- Origin -->
    <rect id="fm-origin" x="300" y="40" width="80" height="42" rx="6" fill="rgba(30,41,59,.35)" stroke="#475569" stroke-width="1.5" opacity="0"/>
    <text id="fm-ot" x="340" y="59" text-anchor="middle" fill="#94a3b8" font-size="9" opacity="0">ORIGIN</text>
    <text id="fm-ou" x="340" y="71" text-anchor="middle" fill="#64748b" font-size="7" opacity="0">upstream</text>

    <!-- Nodes in a triangle -->
    <!-- bouine-0 (top center) -->
    <g id="fm-n0" opacity="0">
      <rect x="270" y="120" width="140" height="100" rx="10" fill="rgba(109,40,217,.1)" stroke="#4c1d95" stroke-width="1.5"/>
      <text x="340" y="140" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">bouine-0</text>
      <text id="fm-recv" x="340" y="155" text-anchor="middle" fill="#4c1d95" font-size="7.5">receives request</text>
      <rect id="fm-store0" x="283" y="162" width="114" height="24" rx="4" fill="rgba(109,40,217,.15)" stroke="#5b21b6" stroke-width="1"/>
      <text id="fm-s0t" x="340" y="178" text-anchor="middle" fill="#7c3aed" font-size="8">hot store</text>
      <rect x="283" y="192" width="114" height="18" rx="3" fill="rgba(109,40,217,.06)" stroke="#2d1b69" stroke-width="1"/>
      <text x="340" y="205" text-anchor="middle" fill="#3b0764" font-size="7">gossip broadcast on fill</text>
    </g>

    <!-- bouine-1 (bottom left) -->
    <g id="fm-n1" opacity="0">
      <rect x="100" y="270" width="140" height="90" rx="10" fill="rgba(109,40,217,.1)" stroke="#4c1d95" stroke-width="1.5"/>
      <text x="170" y="292" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">bouine-1</text>
      <rect id="fm-store1" x="113" y="302" width="114" height="24" rx="4" fill="rgba(109,40,217,.15)" stroke="#5b21b6" stroke-width="1"/>
      <text id="fm-s1t" x="170" y="318" text-anchor="middle" fill="#7c3aed" font-size="8">hot store</text>
      <rect x="113" y="332" width="114" height="18" rx="3" fill="rgba(109,40,217,.06)" stroke="#2d1b69" stroke-width="1"/>
      <text x="170" y="345" text-anchor="middle" fill="#3b0764" font-size="7">receives replicas</text>
    </g>

    <!-- bouine-2 (bottom right) -->
    <g id="fm-n2" opacity="0">
      <rect x="440" y="270" width="140" height="90" rx="10" fill="rgba(109,40,217,.1)" stroke="#4c1d95" stroke-width="1.5"/>
      <text x="510" y="292" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">bouine-2</text>
      <rect id="fm-store2" x="453" y="302" width="114" height="24" rx="4" fill="rgba(109,40,217,.15)" stroke="#5b21b6" stroke-width="1"/>
      <text id="fm-s2t" x="510" y="318" text-anchor="middle" fill="#7c3aed" font-size="8">hot store</text>
      <rect x="453" y="332" width="114" height="18" rx="3" fill="rgba(109,40,217,.06)" stroke="#2d1b69" stroke-width="1"/>
      <text x="510" y="345" text-anchor="middle" fill="#3b0764" font-size="7">receives replicas</text>
    </g>

    <!-- Gossip lines -->
    <line id="fm-g01" x1="290" y1="220" x2="220" y2="270" stroke="#2d1b69" stroke-width="1.5" stroke-dasharray="5,4" opacity="0"/>
    <line id="fm-g02" x1="390" y1="220" x2="460" y2="270" stroke="#2d1b69" stroke-width="1.5" stroke-dasharray="5,4" opacity="0"/>
    <line id="fm-g12" x1="240" y1="315" x2="440" y2="315" stroke="#2d1b69" stroke-width="1.5" stroke-dasharray="5,4" opacity="0"/>

    <!-- Animated dots -->
    <circle id="fm-req" cx="80" cy="166" r="5" fill="#a78bfa" filter="url(#fm-glow)" opacity="0"/>
    <circle id="fm-miss" cx="340" cy="82" r="5" fill="#f59e0b" filter="url(#fm-glow)" opacity="0"/>
    <circle id="fm-fill" cx="340" cy="174" r="5" fill="#4ade80" filter="url(#fm-glow)" opacity="0"/>
    <circle id="fm-rep1" cx="290" cy="220" r="4" fill="#8b5cf6" filter="url(#fm-glow)" opacity="0"/>
    <circle id="fm-rep2" cx="390" cy="220" r="4" fill="#8b5cf6" filter="url(#fm-glow)" opacity="0"/>

    <!-- Step label -->
    <text id="fm-step" x="350" y="400" text-anchor="middle" fill="#a78bfa" font-size="10" opacity="0"></text>
  </svg>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script>
(function(){
  function fmPlay(){
    ['fm-req','fm-miss','fm-fill','fm-rep1','fm-rep2'].forEach(function(id){
      anime.set('#'+id,{opacity:0,translateX:0,translateY:0});
    });
    anime.set('#fm-step',{opacity:0,fill:'#a78bfa'});
    anime.set('#fm-store0',{stroke:'#5b21b6',fill:'rgba(109,40,217,.15)'});
    anime.set('#fm-store1',{stroke:'#5b21b6',fill:'rgba(109,40,217,.15)'});
    anime.set('#fm-store2',{stroke:'#5b21b6',fill:'rgba(109,40,217,.15)'});
    anime.set('#fm-s0t',{fill:'#7c3aed'});
    anime.set('#fm-s1t',{fill:'#7c3aed'});
    anime.set('#fm-s2t',{fill:'#7c3aed'});

    var tl=anime.timeline({autoplay:true,loop:false});

    tl
      .add({targets:'#fm-title',opacity:[0,1],duration:500,easing:'easeOutQuad'})
      .add({targets:'#fm-n0,#fm-n1,#fm-n2',opacity:[0,1],duration:500,easing:'easeOutBack',delay:anime.stagger(120)},'-=200')
      .add({targets:'#fm-client,#fm-ct,#fm-cu,#fm-origin,#fm-ot,#fm-ou',opacity:[0,1],duration:400,delay:anime.stagger(60)},'-=200')
      .add({targets:'#fm-g01,#fm-g02,#fm-g12',opacity:[0,.5],duration:500,delay:anime.stagger(100)},'-=200')

      // Step 1: request arrives
      .add({targets:'#fm-step',innerHTML:'1 ⃝  Request arrives at bouine-0 — MISS in local store',opacity:1,duration:300},'+=400')
      .add({targets:'#fm-req',opacity:1,duration:100})
      .add({targets:'#fm-req',translateX:220,duration:450,easing:'easeOutQuad'})
      .add({targets:'#fm-store0',stroke:['#5b21b6','#ef4444'],duration:300},'-=100')
      .add({targets:'#fm-s0t',fill:'#ef4444',duration:200},'-=200')

      // Step 2: fetch from origin
      .add({targets:'#fm-step',innerHTML:'2 ⃝  Fetch from origin (no peer-fetch in full mode)',duration:300},'+=300')
      .add({targets:'#fm-req',opacity:0,duration:200})
      .add({targets:'#fm-miss',opacity:1,cx:340,cy:174,translateX:0,translateY:0,duration:100})
      .add({targets:'#fm-miss',translateY:-92,duration:400,easing:'easeOutQuad'})
      .add({targets:'#fm-miss',translateY:0,fill:'#4ade80',duration:400,easing:'easeInQuad'})

      // Step 3: store locally
      .add({targets:'#fm-step',innerHTML:'3 ⃝  Store response in local hot store',duration:300},'+=200')
      .add({targets:'#fm-store0',stroke:'#22c55e',fill:'rgba(34,197,94,.12)',duration:400})
      .add({targets:'#fm-s0t',fill:'#4ade80',duration:200},'-=300')
      .add({targets:'#fm-miss',opacity:0,duration:200})

      // Step 4: gossip replication
      .add({targets:'#fm-step',innerHTML:'4 ⃝  Broadcast full object to all peers via gossip replication',duration:300},'+=300')
      .add({targets:'#fm-rep1',opacity:1,cx:290,cy:220,translateX:0,translateY:0,duration:100},'+=200')
      .add({targets:'#fm-rep2',opacity:1,cx:390,cy:220,translateX:0,translateY:0,duration:100},'-=100')
      .add({targets:'#fm-rep1',translateX:-70,translateY:50,duration:700,easing:'easeInOutSine'})
      .add({targets:'#fm-rep2',translateX:70,translateY:50,duration:700,easing:'easeInOutSine'},'-=700')

      // Peers store
      .add({targets:'#fm-store1',stroke:'#22c55e',fill:'rgba(34,197,94,.12)',duration:400},'-=100')
      .add({targets:'#fm-s1t',fill:'#4ade80',duration:200},'-=300')
      .add({targets:'#fm-store2',stroke:'#22c55e',fill:'rgba(34,197,94,.12)',duration:400},'-=300')
      .add({targets:'#fm-s2t',fill:'#4ade80',duration:200},'-=300')
      .add({targets:'#fm-rep1,#fm-rep2',opacity:0,duration:200})

      // Final
      .add({targets:'#fm-step',innerHTML:'All 3 nodes now hold the object · next request to any node → HIT · memory: 3× working set',fill:'#4ade80',duration:400},'+=300');
  }
  window.fmReplay=fmPlay;
  if(typeof anime!=='undefined'){fmPlay();}
})();
</script>
