<div style="position:relative;margin:1.5rem 0;">
  <button id="d2-replay" onclick="d2Replay()" style="position:absolute;top:8px;right:8px;z-index:10;cursor:pointer;padding:.2rem .7rem;border:1px solid rgba(139,92,246,.5);border-radius:4px;background:rgba(13,13,26,.85);color:#c4b5fd;font-size:.7rem;font-family:monospace;letter-spacing:.05em;">↺ replay</button>
  <svg id="d2-svg" viewBox="0 0 700 420" style="width:100%;border-radius:8px;background:#0d0d1a;display:block;" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="d2-glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <text id="d2-title" x="350" y="24" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700" opacity="0">Async invalidation — bouine responds in ~1 ms, CF propagates in background</text>

    <!-- Timeline axis -->
    <line id="d2-axis" x1="60" y1="60" x2="60" y2="380" stroke="#1e1e3a" stroke-width="2" opacity="0"/>
    <text id="d2-t0" x="52" y="80" text-anchor="end" fill="#475569" font-size="8" opacity="0">0 ms</text>
    <text id="d2-t1" x="52" y="140" text-anchor="end" fill="#475569" font-size="8" opacity="0">~1 ms</text>
    <text id="d2-t2" x="52" y="280" text-anchor="end" fill="#475569" font-size="8" opacity="0">~80 ms</text>
    <text id="d2-t3" x="52" y="370" text-anchor="end" fill="#475569" font-size="8" opacity="0">done</text>
    <line x1="55" y1="75" x2="65" y2="75" stroke="#1e1e3a" stroke-width="1.5" opacity="0" class="d2-tick"/>
    <line x1="55" y1="135" x2="65" y2="135" stroke="#1e1e3a" stroke-width="1.5" opacity="0" class="d2-tick"/>
    <line x1="55" y1="275" x2="65" y2="275" stroke="#1e1e3a" stroke-width="1.5" opacity="0" class="d2-tick"/>
    <line x1="55" y1="365" x2="65" y2="365" stroke="#1e1e3a" stroke-width="1.5" opacity="0" class="d2-tick"/>

    <!-- Event: purge arrives -->
    <g id="d2-e1" opacity="0">
      <circle cx="60" cy="75" r="6" fill="#a78bfa" filter="url(#d2-glow)"/>
      <rect x="80" y="60" width="280" height="30" rx="5" fill="rgba(109,40,217,.1)" stroke="#5b21b6" stroke-width="1"/>
      <text x="220" y="80" text-anchor="middle" fill="#a78bfa" font-size="9">POST /v1/purge → bouine receives request</text>
    </g>

    <!-- Event: local evict + 200 response -->
    <g id="d2-e2" opacity="0">
      <circle cx="60" cy="135" r="6" fill="#4ade80" filter="url(#d2-glow)"/>
      <rect x="80" y="115" width="280" height="42" rx="5" fill="rgba(34,197,94,.08)" stroke="#22c55e" stroke-width="1"/>
      <text x="220" y="133" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="600">200 OK returned to operator</text>
      <text x="220" y="148" text-anchor="middle" fill="#16a34a" font-size="8">local cache evicted + cluster fan-out fired</text>
    </g>

    <!-- Background CF goroutine bar -->
    <g id="d2-e3" opacity="0">
      <rect x="400" y="100" width="260" height="190" rx="8" fill="rgba(245,158,11,.04)" stroke="#92400e" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="530" y="120" text-anchor="middle" fill="#b45309" font-size="9" font-weight="600">background goroutine</text>
      <rect x="420" y="135" width="220" height="28" rx="4" fill="rgba(245,158,11,.06)" stroke="#b45309" stroke-width="1"/>
      <text x="530" y="153" text-anchor="middle" fill="#fbbf24" font-size="8">→ Cloudflare Cache API call</text>
      <text x="530" y="180" text-anchor="middle" fill="#92400e" font-size="8">PurgeSingleFile / PurgeByTags</text>
      <text x="530" y="200" text-anchor="middle" fill="#92400e" font-size="7">~50–300 ms round-trip</text>
    </g>

    <!-- CF response -->
    <g id="d2-e4" opacity="0">
      <circle cx="60" cy="275" r="6" fill="#fbbf24" filter="url(#d2-glow)"/>
      <rect x="400" y="235" width="220" height="42" rx="4" fill="rgba(34,197,94,.06)" stroke="#22c55e" stroke-width="1"/>
      <text x="510" y="253" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="600">CF 200 OK</text>
      <text x="510" y="268" text-anchor="middle" fill="#16a34a" font-size="8">edge cache purged globally</text>
    </g>

    <!-- Final state -->
    <g id="d2-e5" opacity="0">
      <circle cx="60" cy="365" r="6" fill="#4ade80"/>
      <rect x="80" y="345" width="540" height="38" rx="5" fill="rgba(34,197,94,.06)" stroke="#22c55e" stroke-width="1"/>
      <text x="350" y="362" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="600">Both caches invalidated — bouine cluster + Cloudflare edge</text>
      <text x="350" y="376" text-anchor="middle" fill="#16a34a" font-size="8">operator saw 200 at ~1 ms · CF completed at ~80 ms · zero client impact</text>
    </g>
  </svg>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script>
(function(){
  function play(){
    anime.set('#d2-e1,#d2-e2,#d2-e3,#d2-e4,#d2-e5',{opacity:0});
    anime.set('.d2-tick',{opacity:0});
    var tl=anime.timeline({autoplay:true,loop:false});
    tl.add({targets:'#d2-title',opacity:[0,1],duration:500,easing:'easeOutQuad'})
      .add({targets:'#d2-axis',opacity:[0,1],duration:400},'-=200')
      .add({targets:'.d2-tick',opacity:[0,1],duration:300,delay:anime.stagger(80)},'-=200')
      .add({targets:'#d2-t0,#d2-t1,#d2-t2,#d2-t3',opacity:[0,1],duration:300,delay:anime.stagger(80)},'-=200')
      .add({targets:'#d2-e1',opacity:[0,1],translateX:[-20,0],duration:500,easing:'easeOutBack'},'+=300')
      .add({targets:'#d2-e2',opacity:[0,1],translateX:[-20,0],duration:500,easing:'easeOutBack'},'+=500')
      .add({targets:'#d2-e3',opacity:[0,1],translateX:[20,0],duration:600,easing:'easeOutBack'},'+=200')
      .add({targets:'#d2-e4',opacity:[0,1],translateX:[20,0],duration:500,easing:'easeOutBack'},'+=800')
      .add({targets:'#d2-e5',opacity:[0,1],translateY:[10,0],duration:500,easing:'easeOutBack'},'+=400');
  }
  window.d2Replay=play;
  if(typeof anime!=='undefined'){play();}
})();
</script>
